# Secret patterns (regex) and configuration checks for non-code files.
# Used by secreview/detect/secrets.py. All checks are deterministic (no LLM).

secrets:
  - { id: aws-access-key, regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b', severity: critical }
  - { id: aws-secret-key, regex: '(?i)aws(.{0,20})?(secret|private)?.{0,20}[''"][0-9a-zA-Z/+]{40}[''"]', severity: critical }
  - { id: github-token, regex: '\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{36}\b|\bgithub_pat_[0-9A-Za-z_]{60,}\b', severity: critical }
  - { id: gitlab-token, regex: '\bglpat-[0-9A-Za-z\-_]{20}\b', severity: critical }
  - { id: slack-token, regex: '\bxox[abposr]-[0-9A-Za-z-]{10,}\b', severity: high }
  - { id: slack-webhook, regex: 'https://hooks\.slack\.com/services/[A-Za-z0-9/]{20,}', severity: medium }
  - { id: google-api-key, regex: '\bAIza[0-9A-Za-z\-_]{35}\b', severity: high }
  - { id: stripe-secret, regex: '\b(sk|rk)_live_[0-9a-zA-Z]{24,}\b', severity: critical }
  - { id: openai-key, regex: '\bsk-(proj-)?[A-Za-z0-9_\-]{32,}\b', severity: critical }
  - { id: openrouter-key, regex: '\bsk-or-v1-[0-9a-f]{64}\b', severity: critical }
  - { id: anthropic-key, regex: '\bsk-ant-[A-Za-z0-9_\-]{32,}\b', severity: critical }
  - { id: sendgrid-key, regex: '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b', severity: high }
  - { id: twilio-key, regex: '\bSK[0-9a-fA-F]{32}\b', severity: high }
  - { id: private-key, regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----', severity: critical }
  - { id: db-uri-credentials, regex: '\b(mongodb(\+srv)?|postgres(ql)?|mysql|mariadb|redis|amqp|mssql)://[^\s:/@''"]+:[^\s@''"]{3,}@[^\s''"]+', severity: high }
  - { id: jwt-literal, regex: '\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b', severity: medium }
  - { id: generic-secret-assignment, regex: '(?i)\b[\w.-]*(secret|password|passwd|api[_-]?key|access[_-]?key|auth[_-]?token|private[_-]?key|client[_-]?secret)[\w.-]*\s*[:=]\s*[''"]?([^\s''"$<>{}]{8,})[''"]?', severity: high, value_group: 2, config_files_only: true }

# Values that look like placeholders are ignored.
placeholders: '(?i)^(changeme|change[-_]?me|xxx+|your[-_].*|<.*>|\$\{.*\}|\*+|example|dummy|sample|test|none|null|password|secret|true|false|redacted|todo|placeholder|[.]{3,}|process\.env.*|os\.environ.*|env\(.*)$'

# Files scanned for secrets in addition to source files.
config_globs: ['.env', '.env.*', '*.env', '*.properties', '*.yml', '*.yaml', '*.json', '*.xml', '*.ini', '*.cfg', '*.conf', '*.toml', 'Dockerfile', 'docker-compose*.yml']
skip_globs: ['package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', '*.min.js', '*.map', 'poetry.lock', '*.lock', '.env.example', '.env.sample', '.env.template']

# Configuration checks: (file glob, regex) -> class
config_checks:
  - id: spring-actuator-exposed
    files: ['application*.properties', 'application*.yml', 'application*.yaml']
    regex: '(?i)management\.endpoints\.web\.exposure\.include\s*[:=]\s*[''"]?\*|include:\s*[''"]?\*'
    class: debug_enabled
    message: All Spring Boot actuator endpoints are exposed over HTTP.
  - id: spring-stacktrace
    files: ['application*.properties', 'application*.yml', 'application*.yaml']
    regex: '(?i)server\.error\.include-(stacktrace|exception|message)\s*[:=]\s*(always|true)|include-stacktrace:\s*always'
    class: error_leakage
    message: Spring Boot includes stack traces / exception details in error responses.
  - id: spring-h2-console
    files: ['application*.properties', 'application*.yml', 'application*.yaml']
    regex: '(?i)spring\.h2\.console\.enabled\s*[:=]\s*true'
    class: debug_enabled
    message: H2 web console enabled (remote code execution if reachable).
  - id: spring-debug
    files: ['application*.properties']
    regex: '(?m)^\s*debug\s*=\s*true'
    class: debug_enabled
    message: Spring debug mode enabled.
  - id: spring-datasource-password
    files: ['application*.properties', 'application*.yml', 'application*.yaml']
    regex: '(?i)(spring\.datasource\.password|password)\s*[:=]\s*(?!\$\{)[^\s#]{4,}'
    class: hardcoded_secret
    message: Datasource password hardcoded in configuration.
  - id: django-allowed-hosts
    files: ['*settings*.py']
    regex: 'ALLOWED_HOSTS\s*=\s*\[\s*[''"]\*[''"]\s*\]'
    class: security_misconfig
    message: Django ALLOWED_HOSTS accepts any host.
  - id: committed-dotenv
    files: ['.env', '.env.production', '.env.prod', '.env.local']
    regex: '(?im)^\s*[A-Z0-9_]*(SECRET|PASSWORD|TOKEN|KEY)[A-Z0-9_]*\s*=\s*\S{6,}'
    class: hardcoded_secret
    message: Secrets committed in a .env file.
  - id: docker-root-secret-env
    files: ['Dockerfile', '*.Dockerfile']
    regex: '(?i)^\s*ENV\s+\S*(SECRET|PASSWORD|TOKEN|API_KEY)\S*[ =]\S{6,}'
    class: hardcoded_secret
    message: Secret baked into a Docker image through ENV.
