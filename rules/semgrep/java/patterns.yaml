- id: java-xxe-documentbuilder
  languages:
  - java
  severity: ERROR
  message: DocumentBuilderFactory without disallow-doctype-decl allows XXE.
  metadata:
    class: xxe
    confidence: high
  patterns:
  - pattern: $DBF = DocumentBuilderFactory.newInstance();
  - pattern-not-inside: '$DBF = DocumentBuilderFactory.newInstance();

      ...

      $DBF.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

      '
  - pattern-not-inside: '$DBF = DocumentBuilderFactory.newInstance();

      ...

      $DBF.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);

      ...

      $DBF.setExpandEntityReferences(false);

      '
