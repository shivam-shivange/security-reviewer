# GENERATED from rules/semgrep_src by scripts/build_rules.py - edit the source.
# JavaScript / TypeScript (Express, Node, Mongoose, React) taint rules.
# Anchors are expanded by scripts/build_rules.py.
rules:
- id: js-sqli
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Untrusted request data reaches a SQL query string. Use placeholders (?, $1) and a values array.
  metadata:
    class: sqli
    confidence: high
  pattern-sources:
  - pattern: req.query
  - pattern: req.body
  - pattern: req.params
  - pattern: req.headers
  - pattern: req.cookies
  - pattern: req.files
  - pattern: req.file
  - pattern: req.get(...)
  - pattern: req.header(...)
  - pattern: request.query
  - pattern: request.body
  - pattern: request.params
  - pattern: ctx.request.body
  - pattern: ctx.query
  - pattern: ctx.params
  - pattern: process.argv
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.query($Q, ...)
      - pattern: $DB.execute($Q, ...)
      - pattern: $SEQ.query($Q, ...)
      - pattern: $KNEX.raw($Q, ...)
      - pattern: $KNEX.whereRaw($Q, ...)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: parseFloat(...)
  - pattern: Number(...)
  - pattern: Boolean(...)
  - pattern: $V.isInt(...)
  - pattern: mysql.escape(...)
  - pattern: $C.escape(...)
- id: js-nosqli
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: 'Untrusted request data is used inside a MongoDB query object; {"$ne": null}-style operators can bypass checks.'
  metadata:
    class: nosqli
    confidence: high
  pattern-sources:
  - pattern: req.query
  - pattern: req.body
  - pattern: req.params
  - pattern: req.cookies
  - pattern: request.body
  - pattern: request.query
  - pattern: ctx.request.body
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $M.$METHOD($Q, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|findOneAndRemove|findOneAndReplace|updateOne|updateMany|deleteOne|deleteMany|remove|count|countDocuments|exists|where|replaceOne|aggregate)$
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: String(...)
  - pattern: Number(...)
  - pattern: parseInt(...)
  - pattern: '{$eq: $X}'
  - pattern: mongoSanitize(...)
  - pattern: sanitize(...)
  - pattern: $V.toString()
  - pattern: mongoose.Types.ObjectId(...)
  - pattern: new mongoose.Types.ObjectId(...)
  - pattern: new ObjectId(...)
  - pattern: ObjectId(...)
  - pattern: $V.escape(...)
- id: js-cmdi
