- id: js-prototype-pollution-assign
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: A request-controlled key is used in a nested property assignment; "__proto__" pollutes Object.prototype.
  metadata:
    class: prototype_pollution
    confidence: high
  pattern-sources:
  - pattern: req.query
  - pattern: req.body
  - pattern: req.params
  - pattern: req.headers
  - pattern: req.cookies
  - pattern: req.files
  - pattern: req.file
