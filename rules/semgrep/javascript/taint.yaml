    confidence: high
  pattern-sources:
  - pattern: req.query
  - pattern: req.body
  - pattern: req.params
  - pattern: req.headers
  - pattern: req.cookies
  - pattern: req.files
  - pattern: req.file
  - pattern: req.get(...)
  - pattern: req.header(...)
  - pattern: request.query
  - pattern: request.body
  - pattern: request.params
  - pattern: ctx.request.body
  - pattern: ctx.query
  - pattern: ctx.params
  - pattern: process.argv
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $CP.exec($CMD, ...)
      - pattern: $CP.execSync($CMD, ...)
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
      - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: 'spawn($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: shelljs.exec($CMD, ...)
      - pattern: shell.exec($CMD, ...)
    - focus-metavariable: $CMD
  pattern-sanitizers:
  - pattern: shellescape(...)
  - pattern: shellQuote.quote(...)
  - pattern: parseInt(...)
