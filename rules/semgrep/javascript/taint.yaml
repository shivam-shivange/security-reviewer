- id: js-path-traversal
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Untrusted data is used in a filesystem path without confinement to a base directory.
  metadata:
    class: path_traversal
    confidence: high
  pattern-sources:
  - pattern: req.query
  - pattern: req.body
  - pattern: req.params
  - pattern: req.headers
  - pattern: req.cookies
  - pattern: req.files
  - pattern: req.file
  - pattern: req.get(...)
  - pattern: req.header(...)
  - pattern: request.query
  - pattern: request.body
  - pattern: request.params
  - pattern: ctx.request.body
  - pattern: ctx.query
  - pattern: ctx.params
  - pattern: process.argv
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: fs.$F($P, ...)
      - pattern: fsPromises.$F($P, ...)
      - pattern: fs.promises.$F($P, ...)
      - pattern: $RES.sendFile($P)
      - pattern: $RES.download($P, ...)
      - pattern: $RES.attachment($P)
    - metavariable-regex:
        metavariable: $F
        regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|stat|statSync|open|openSync|access|accessSync|copyFile|rename)$
    - focus-metavariable: $P
