  - pattern: ctx.query
  - pattern: ctx.params
  - pattern: process.argv
  pattern-sinks:
  - patterns:
    - pattern: $OBJ[$K1][$K2] = $V
    - focus-metavariable: $K1
  pattern-sanitizers:
  - pattern: secreviewSafeKey(...)
