# Python taint rules: untrusted input (Flask / Django / FastAPI / CLI) reaching dangerous sinks.
# metadata.class maps to rules/taxonomy.yaml. Sanitizers stop a flow (=> not reported).
rules:
- id: py-sqli
  mode: taint
  languages:
  - python
  severity: ERROR
  message: Untrusted input reaches a SQL query string ($SINK). Use a parameterised query.
  metadata:
    class: sqli
    confidence: high
  pattern-sources:
  - pattern: flask.request.$ATTR
  - pattern: flask.request.$ATTR.get(...)
  - pattern: flask.request.$ATTR[...]
  - pattern: flask.request.get_json(...)
  - pattern: request.$ATTR.get(...)
  - pattern: request.$ATTR[...]
  - pattern: request.get_json(...)
  - patterns:
    - pattern: request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(args|form|values|json|data|cookies|headers|files|GET|POST|COOKIES|META|body|query_params|path_params)$
  - pattern: input(...)
  - pattern: sys.argv
  - patterns:
    - pattern-inside: "@$APP.$METHOD(...)\ndef $FN(..., $PARAM, ...):\n  ...\n"
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|delete|patch|api_route)$
    - pattern: $PARAM
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($Q, ...)
      - pattern: $C.executemany($Q, ...)
      - pattern: $C.executescript($Q)
      - pattern: $M.objects.raw($Q, ...)
      - pattern: $M.objects.extra(...)
      - pattern: sqlalchemy.text($Q)
      - pattern: text($Q)
      - pattern: $DB.engine.execute($Q, ...)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: int(...)
  - pattern: float(...)
  - pattern: bool(...)
  - pattern: uuid.UUID(...)
- id: py-nosqli
  mode: taint
  languages:
  - python
  severity: ERROR
  message: 'Request JSON flows into a MongoDB query; objects such as {"$ne": null} change the query logic.'
  metadata:
    class: nosqli
    confidence: medium
  pattern-sources:
  - pattern: request.get_json(...)
  - pattern: request.json
  - pattern: flask.request.get_json(...)
  - pattern: flask.request.json
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $COL.$METHOD($Q, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(find|find_one|find_one_and_update|find_one_and_delete|update_one|update_many|delete_one|delete_many|count_documents|aggregate)$
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: str(...)
  - pattern: int(...)
